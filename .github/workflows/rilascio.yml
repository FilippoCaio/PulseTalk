name: Rilascio

# Compila l'applicazione e pubblica la release da cui i client si aggiornano.
#
# Il punto di tutto questo e' che `git push` da solo non aggiorna nessuno: chi
# ha l'app installata guarda le release, e le release nascono qui. Il giro
# completo e' tre comandi in locale:
#
#   npm version 0.3.1 --no-git-tag-version   (dentro app/)
#   git commit -am "0.3.1"
#   git tag v0.3.1 && git push --follow-tags
#
# Da li' in poi non c'e' piu' niente da fare a mano: la release compare con
# dentro l'installer, il suo .blockmap e latest.yml, e i client la trovano al
# primo riavvio.

on:
  push:
    tags: ['v*']
  # Per provarlo senza mettere un tag. Compila ma non pubblica.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Controlla che tag e versione coincidano
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          # Percorso assoluto e non relativo: se per qualunque motivo il passo
          # non parte dalla cartella app/, un percorso relativo fallisce con un
          # errore che non dice quale file cercava. Qui invece si vede.
          $file = Join-Path $env:GITHUB_WORKSPACE 'app/package.json'
          Write-Host "Leggo $file"
          if (-not (Test-Path $file)) { throw "Non trovo $file" }

          $versione = (Get-Content $file -Raw | ConvertFrom-Json).version
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          Write-Host "tag='$tag'  package.json='$versione'"
          # Questo controllo esiste per un motivo preciso: con package.json
          # fermo a 0.3.0 e il tag a v0.3.1, la release si chiamerebbe 0.3.1 ma
          # dentro latest.yml direbbe 0.3.0 - e i client, che confrontano quel
          # numero con il proprio, non si aggiornerebbero mai senza che nessuno
          # capisca perche'.
          if ($tag -ne $versione) {
            throw "Il tag dice $tag ma package.json dice $versione: allinea i due prima di pubblicare."
          }
          Write-Host "Versione $versione"

      - name: Installa le dipendenze
        run: npm ci

      - name: Compila
        run: npm run build

      - name: Genera l'icona
        run: npm run icon

      # --publish always carica installer, .blockmap e latest.yml nella release
      # del tag. Senza latest.yml l'aggiornamento non parte, anche con
      # l'installer al suo posto: e' l'errore facile da fare a mano, e qui non
      # si puo' fare.
      - name: Pubblica
        if: startsWith(github.ref, 'refs/tags/')
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ github.token }}

      # Sul lancio manuale ci si ferma qui: serve a sapere se compila, non a
      # pubblicare per sbaglio una versione che nessuno ha deciso di rilasciare.
      - name: Compila senza pubblicare
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: PulseTalk-prova
          path: app/release/*.exe
          retention-days: 7
