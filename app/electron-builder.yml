appId: com.filippocaio.pulsetalk
productName: PulseTalk
copyright: Copyright © 2026 Filippo Caio

directories:
  output: release

# Nel pacchetto va solo il compilato: i sorgenti in src/ li ha gia' tradotti
# electron-vite dentro out/, e livekit-client e' finito dentro al bundle del
# renderer invece che in node_modules — per questo non compare fra le
# dipendenze di produzione.
files:
  - out/**
  - build/icona.png
  - package.json

# Dove l'app installata va a cercare le versioni nuove, e dove electron-builder
# carica quando gli si passa --publish.
#
# Il file che conta e' latest.yml: lo genera la build accanto all'installer, e
# senza quello caricato nella release l'aggiornatore non trova niente anche se
# l'exe c'e'. Vale solo per l'installer: il portabile non si aggiorna da solo,
# e l'app lo sa e lo dice invece di provarci.
# Dove l app installata cerca le versioni nuove.
#
# Il server di PulseTalk stesso, non GitHub: e lo stesso indirizzo a cui il
# client e gia collegato, quindi non c e un nome nuovo da esporre ne un
# repository da tenere pubblico. Chi puo entrare in una stanza puo gia
# scaricare l aggiornamento, e non serve altro permesso.
#
# L indirizzo qui e un segnaposto: quello vero lo passa la compilazione,
# letto da server.local, cosi il repo pubblico resta senza riferimenti a
# nessuna rete. Il file che conta e latest.yml, che electron-builder genera
# accanto all installer.
publish:
  provider: generic
  url: https://esempio.invalid/aggiornamenti

win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
  signAndEditExecutable: true

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: PulseTalk

portable:
  artifactName: PulseTalk-portable-${version}.exe
