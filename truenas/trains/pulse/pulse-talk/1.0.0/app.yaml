# I metadati dell'app, nel formato che truenas/apps usa oggi.
#
# Ricavato leggendo il repository ufficiale e il suo CONTRIBUTIONS.md, non a
# memoria: la struttura del catalogo di TrueNAS e' cambiata piu' di una volta, e
# dalla 24.10 le app sono basate su Docker Compose invece che su Helm.
#
# Due campi che gli app ufficiali hanno e questo no, di proposito:
#
#   lib_version / lib_version_hash   dichiarano quale versione della libreria
#     Python di iX il template usa. Questo template non la usa: emette il
#     Compose direttamente, cosi' non c'e' una libreria vendorizzata da tenere
#     allineata a ogni rilascio di TrueNAS.
#
# `min_scale_version` e' la prima versione che sa leggere questo formato: la
# 24.10.2.2, la stessa che dichiarano le app ufficiali.

